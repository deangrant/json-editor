# Workspace package locations; globs matching directories that contain a
# package.json.
packages:
  - "apps/*"
  - "packages/*"

# Shared dependency versions referenced by packages via `catalog:`.
catalog:
  "@codemirror/commands": 6.8.0
  "@codemirror/lang-json": 6.0.1
  "@codemirror/language": 6.10.8
  "@codemirror/search": 6.5.10
  "@codemirror/state": 6.5.0
  "@codemirror/view": 6.36.1
  "@fontsource/ibm-plex-mono": 5.2.5
  "@fontsource/ibm-plex-sans": 5.2.5
  "@types/node": 22.13.4
  "@types/react": 19.0.8
  "@types/react-dom": 19.0.3
  "@vitejs/plugin-react": 4.3.4
  ajv: 8.17.1
  jsonrepair: 3.12.0
  react: 19.1.1
  react-dom: 19.1.1
  typescript: 5.8.3
  vite: 6.3.5
  vitest: 3.0.5

# Dependency install/build scripts run only when listed here. true = allow,
# false = deny; unlisted packages fail install (strictDepBuilds).
allowBuilds:
  esbuild: true

# Fail install when the current Node/pnpm version is outside package.json
# engines. Documents intent; without this, engines is advisory only.
engineStrict: true

# Fail install when a dependency has build scripts not listed in allowBuilds.
# pnpm 11 default is true; set explicitly so intent survives default changes.
strictDepBuilds: true

# Enforces exact dependency versioning across all workspace packages.
saveExact: true

# 21 days, expressed in minutes (21 × 24 × 60); pnpm requires minutes for this
# setting.
minimumReleaseAge: 30240

# Exclude packages from the minimum release age policy.
minimumReleaseAgeExclude:
  - brace-expansion@5.0.9 # CVE-2026-69152 fixed in 5.0.9 (2026-07-30T10:00:32.762Z).
  - fast-uri@3.1.5 # CVE-2026-18446, fixed in 3.1.5 (2026-07-31T09:16:56.212Z).

# Block transitive deps from exotic sources (git/URL); only registry, workspace,
# or local. pnpm 11 default is true; set explicitly so intent survives default
# changes.
blockExoticSubdeps: true

# Force-replace transitive versions across the dependency graph to avoid
# supply-chain downgrades.
overrides:
  undici-types: 6.27.0

# Block installs when a version has weaker trust evidence than an
# earlier-published release (trusted publisher > provenance > none); mitigates
# supply-chain downgrades.
trustPolicy: no-downgrade

# Exclude packages from the trust policy check. Use only after verifying the
# version is safe (e.g. missing provenance is accidental, not a takeover).
trustPolicyExclude:
  - semver@6.3.1 # Required by react-doctor@0.7.2 as a direct dependency.
